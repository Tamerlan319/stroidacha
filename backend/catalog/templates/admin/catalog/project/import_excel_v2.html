{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Импорт проектов из Excel v2</h1>

  <p>
    Файл должен быть в формате <strong>.xlsx</strong> и содержать листы:
    <code>projects</code>,
    <code>price_options</code>,
    <code>addons</code>,
    <code>package_items</code>.
  </p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <fieldset class="module aligned">
      {{ form.as_p }}
    </fieldset>

    <div class="submit-row">
      <input type="submit" value="Импортировать" class="default">
      <a href=".." class="button cancel-link">Назад</a>
    </div>
  </form>
{% endblock %}
