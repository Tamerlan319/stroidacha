name: brusoteka

services:
  db:
    image: postgres:16-alpine
    container_name: brusoteka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in backend/.env.prod}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in backend/.env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    shm_size: 128mb

  backend:
    build:
      context: ./backend
    container_name: brusoteka_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-2}
      --timeout 120
      --max-requests 500
      --max-requests-jitter 50"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      # Вложения заявок (leads.LeadAttachment) — приватное хранилище.
      # Намеренно НЕ примонтировано в сервис caddy: только backend может
      # прочитать эти файлы, отдача наружу идёт через авторизованный
      # LeadAttachmentDownloadView, а не напрямую файловым сервером.
      - private_media_data:/app/private_media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': '127.0.0.1', 'X-Forwarded-Proto': 'https'}); response = urllib.request.urlopen(request, timeout=5); assert response.status == 200",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 512m
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "https://brusodel.ru/api"
        NEXT_PUBLIC_SITE_URL: "https://brusodel.ru"
    container_name: brusoteka_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: "https://brusodel.ru/api"
      NEXT_PUBLIC_SITE_URL: "https://brusodel.ru"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: brusoteka_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Даёт остальным контейнерам (в первую очередь frontend, который при
        # серверном рендеринге сам ходит на NEXT_PUBLIC_API_URL =
        # https://brusodel.ru/api) резолвить домен сайта на Caddy внутри
        # docker-сети, а не через публичный DNS. Без этого запрос уходит на
        # собственный плавающий IP сервера и виснет — hairpin NAT к самому
        # себе через floating IP не работает на некоторых облачных
        # провайдерах (в частности, на Рег.Облаке — на классическом VPS
        # такой проблемы не было).
        aliases:
          - brusodel.ru
          - www.brusodel.ru
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 128m

networks:
  default:

volumes:
  postgres_data:
  media_data:
  private_media_data:
  static_data:
  caddy_data:
  caddy_config:
